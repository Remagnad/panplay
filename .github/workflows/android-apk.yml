name: Android APK

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build full PanPlay APK
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      COMPONENTS_DIR: ${{ github.workspace }}/.ci/components
      BUILD_DIR: ${{ github.workspace }}/.ci/build
      BUILD_JOBS: "2"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android and cross-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential autoconf automake libtool gettext pkg-config \
            cmake ninja-build meson glslang-tools bison flex nasm yasm \
            git curl wget ca-certificates unzip zip tar xz-utils zstd \
            python3 python3-pip python3-yaml python3-mako python3-venv \
            libffi-dev libcap-dev libdbus-1-dev libglib2.0-dev \
            libxml2-dev libssl-dev libzstd-dev liblz4-dev \
            libncurses-dev libedit-dev libcurl4-openssl-dev \
            libxcb1-dev libxcb-randr0-dev libxcb-dri3-dev libxcb-present-dev \
            libxcb-shm0-dev libxcb-sync-dev libxcb-xfixes0-dev libxcb-glx0-dev libxcb-dri2-0-dev \
            libx11-dev libx11-xcb-dev libxshmfence-dev libxrandr-dev libxfixes-dev \
            libxext-dev libxxf86vm-dev libgl-dev mesa-common-dev x11proto-dev
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"
          yes | sdkmanager --licenses

      - name: Restore pinned component cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.ci/components
            app/src/main/assets/deps/wow64
          key: panplay-components-${{ runner.os }}-${{ hashFiles('scripts/components.env', 'app/bundled-components.json', 'scripts/*.sh', 'runtimes/**', 'meson/**') }}
          restore-keys: |
            panplay-components-${{ runner.os }}-

      - name: Fetch prebuilt rootfs and Proton
        run: |
          mkdir -p "$COMPONENTS_DIR" "$BUILD_DIR"
          OUT="$COMPONENTS_DIR" sh scripts/fetch-launcher-components.sh

      - name: Build FEX ARM64EC and WOW64
        run: |
          expected="$(python3 -c 'import json; print(next(c["sha256"] for c in json.load(open("app/bundled-components.json"))["components"] if c["file"] == "fexcore-2609.1.wcp"))')"
          if ! printf '%s  %s\n' "$expected" "$COMPONENTS_DIR/fexcore-2609.1.wcp" | sha256sum -c --status 2>/dev/null; then
            OUT="$COMPONENTS_DIR" WORK="$BUILD_DIR" JOBS="$BUILD_JOBS" sh scripts/build-fex-windows.sh
          else
            echo "Using cached, checksum-verified FEX WCP"
          fi

      - name: Build DXVK and VKD3D-Proton
        run: |
          python3 - "$COMPONENTS_DIR" <<'PY'
          import hashlib, json, pathlib, subprocess, sys, os
          def digest(path):
              h = hashlib.sha256()
              with path.open("rb") as f:
                  for block in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(block)
              return h.hexdigest()
          out = pathlib.Path(sys.argv[1])
          manifest = json.load(open("app/bundled-components.json"))
          files = {c["file"]: c["sha256"] for c in manifest["components"]}
          names = ["dxvk-3.1.1-4-arm64ec.wcp", "vkd3d-3.0.1-452-g22307558.wcp"]
          valid = all((out / n).is_file() and digest(out / n) == files[n] for n in names)
          if valid:
              print("Using cached, checksum-verified DXVK and VKD3D WCPs")
          else:
              subprocess.run(["sh", "scripts/build-dxvk.sh"], check=True, env={**os.environ, "OUT": str(out), "WORK": str(pathlib.Path(os.environ["BUILD_DIR"])), "JOBS": "2"})
          PY

      - name: Build Box64 WOW64 support
        run: |
          # Box64's PE/WCP output is rebuilt from pinned source and toolchain.
          # Its archive hash can vary between identical CI builds, so pin the
          # exact generated bytes into the build-local manifest below.
          OUT="$GITHUB_WORKSPACE/app/src/main/assets/deps/wow64" \
          OUT_WCP="$COMPONENTS_DIR" WORK="$BUILD_DIR" JOBS="$BUILD_JOBS" \
            sh scripts/build-box64-wow64.sh

      - name: Build PulseAudio and ALSA Android components
        run: |
          python3 - "$COMPONENTS_DIR" <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys
          def digest(path):
              h = hashlib.sha256()
              with path.open("rb") as f:
                  for block in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(block)
              return h.hexdigest()
          out = pathlib.Path(sys.argv[1])
          manifest = json.load(open("app/bundled-components.json"))
          files = {c["file"]: c["sha256"] for c in manifest["components"]}
          names = ["PulseAudio-17.0-2.wcp", "ALSA-1.2.16.1-2.wcp"]
          valid = all((out / n).is_file() and digest(out / n) == files[n] for n in names)
          if valid:
              print("Using cached, checksum-verified audio WCPs")
          else:
              env = {**os.environ, "OUT": str(out), "WORK": str(pathlib.Path(os.environ["BUILD_DIR"])/"audio"),
                     "JOBS": "2", "NDK": str(pathlib.Path(os.environ["ANDROID_HOME"])/"ndk/29.0.14206865")}
              subprocess.run(["sh", "scripts/build-audio.sh"], check=True, env=env)
          PY

      - name: Build Mesa Zink OpenGL component
        run: |
          # Ubuntu 24.04 ships Meson 1.3.2; Mesa 26.2.4 requires >= 1.4.0.
          # Isolate the pinned build tool from the distro-managed Meson (PEP 668).
          python3 -m venv "$BUILD_DIR/meson-venv"
          "$BUILD_DIR/meson-venv/bin/pip" install --disable-pip-version-check --no-input "meson==1.4.2" "packaging==24.2" "Mako==1.3.10" "PyYAML==6.0.2"
          export PATH="$BUILD_DIR/meson-venv/bin:$PATH"
          meson --version
          "$BUILD_DIR/meson-venv/bin/python" -c 'import mako, packaging.version, yaml; print("Python Mako:", mako.__version__); print("Python packaging:", packaging.version.__version__ if hasattr(packaging.version, "__version__") else "available"); print("Python PyYAML:", yaml.__version__)'
          NDK="$ANDROID_HOME/ndk/29.0.14206865"
          WCP="$COMPONENTS_DIR/Mesa-Zink-26.2.4-1.wcp"
          WCP_SHA="$WCP.sha256"
          cached=false
          if [ -s "$WCP" ] && [ -s "$WCP_SHA" ]; then
            expected="$(awk '{print $1}' "$WCP_SHA")"
            actual="$(sha256sum "$WCP" | awk '{print $1}')"
            [ "$expected" = "$actual" ] && cached=true
          fi
          if [ "$cached" != true ]; then
            sh scripts/build-android-deps.sh --api 29 --ndk "$NDK" --out "$BUILD_DIR/android-deps"
            OUT="$COMPONENTS_DIR" WORK="$BUILD_DIR/mesa-zink" JOBS="$BUILD_JOBS" \
            NDK="$NDK" DRM_PCDIR="$BUILD_DIR/android-deps/lib/pkgconfig" \
              sh scripts/build-mesa-zink.sh
          else
            echo "Using cached, checksum-verified Mesa Zink WCP"
          fi
          test -s "$WCP"
          zstd -dc "$WCP" | tar -tf - > "$BUILD_DIR/mesa-zink-contents.txt"
          for entry in ./lib/libEGL.so.1 ./lib/libGLESv2.so.2 ./lib/libGLESv1_CM.so.1 ./lib/dri/zink_dri.so; do
            grep -Fxq "$entry" "$BUILD_DIR/mesa-zink-contents.txt" || {
              echo "Mesa Zink WCP is missing $entry" >&2
              exit 1
            }
          done
          echo "Verified Mesa Zink EGL/GLES and Zink driver inside WCP"

      - name: Pin generated component checksums
        run: |
          python3 - "$COMPONENTS_DIR" <<'PY'
          import hashlib, json, pathlib, sys
          manifest_path = pathlib.Path("app/bundled-components.json")
          manifest = json.loads(manifest_path.read_text())
          generated = [
              "box64-0.4.5-2f47bdf.wcp",
              "Mesa-Zink-26.2.4-1.wcp",
          ]
          for name in generated:
              component = next(c for c in manifest["components"] if c["file"] == name)
              path = pathlib.Path(sys.argv[1]) / name
              if not path.is_file():
                  raise SystemExit(f"Missing generated component WCP: {path}")
              component["sha256"] = hashlib.sha256(path.read_bytes()).hexdigest()
              print(f"Pinned generated {name} sha256: {component['sha256']}")
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")
          PY

      - name: Verify every pinned component
        run: |
          python3 - "$COMPONENTS_DIR" <<'PY'
          import hashlib, json, pathlib, sys
          def digest(path):
              h = hashlib.sha256()
              with path.open("rb") as f:
                  for block in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(block)
              return h.hexdigest()
          out = pathlib.Path(sys.argv[1])
          components = json.load(open("app/bundled-components.json"))["components"]
          failed = []
          for c in components:
              p = out / c["file"]
              actual = digest(p) if p.is_file() else "missing"
              ok = actual == c["sha256"]
              print(f"{'OK' if ok else 'FAIL'} {c['file']}")
              if not ok: failed.append(c["file"])
          if failed:
              raise SystemExit("Pinned component verification failed: " + ", ".join(failed))
          wowbox = pathlib.Path("app/src/main/assets/deps/wow64/wowbox64.dll")
          if not wowbox.is_file():
              raise SystemExit(f"Missing {wowbox}")
          print(f"OK {wowbox}")
          PY

      - name: Run unit tests and build full APK
        run: |
          ./gradlew --no-daemon --stacktrace \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            -PbundleComponents=true \
            -PcomponentsDir="$COMPONENTS_DIR"
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          echo "Full APK size:"
          ls -lh "$APK"
          python3 - "$APK" <<'PY'
          import sys, zipfile
          apk = zipfile.ZipFile(sys.argv[1])
          names = set(apk.namelist())
          expected = [
              "assets/components/imagefs_bionic.txz",
              "assets/components/proton-11.0-2-arm64ec.wcp",
              "assets/components/fexcore-2609.1.wcp",
              "assets/components/dxvk-3.1.1-4-arm64ec.wcp",
              "assets/components/vkd3d-3.0.1-452-g22307558.wcp",
              "assets/components/box64-0.4.5-2f47bdf.wcp",
              "assets/components/PulseAudio-17.0-2.wcp",
              "assets/components/ALSA-1.2.16.1-2.wcp",
              "assets/components/Mesa-Zink-26.2.4-1.wcp",
              "assets/deps/wow64/wowbox64.dll",
          ]
          missing = [n for n in expected if n not in names]
          if missing:
              raise SystemExit("APK missing full-build assets: " + ", ".join(missing))
          print(f"Verified {len(expected)} full-build assets inside APK")
          PY

      - name: Upload full APK
        uses: actions/upload-artifact@v7
        with:
          name: panplay-full-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
